:root{
  --pink:#f472d0;

  --teal:#2bc0d6;

  --line:#e6e3f1;

  --warn:#9a5b12;
  --err:#c0262f;
  --radius:22px;
  --shadow-sm:0 1px 2px rgba(10,5,40,.12),0 6px 18px rgba(10,5,40,.14);
  --shadow-md:0 18px 44px rgba(10,5,40,.35);

  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}

html,body{height:100%}

button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,textarea:focus-visible{outline:2px solid #fff;outline-offset:2px}

/* Contenitore app: schermo intero, centrato e limitato su schermi larghi */
.app{
  height:100dvh;max-width:560px;margin:0 auto;
  display:flex;flex-direction:column;position:relative;overflow:hidden;
}
@supports not (height:100dvh){.app{height:100vh}}
@media (min-width:600px){
  .app{height:calc(100dvh - 32px);margin-top:16px;border-radius:28px;border:1px solid var(--glass-line);box-shadow:var(--shadow-md)}
}

/* ---------- Header ---------- */
.header{
  display:flex;align-items:center;gap:10px;
  padding:calc(12px + env(safe-area-inset-top)) 16px 10px;
  background:rgba(25,20,70,.38);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--glass-line);flex:0 0 auto;
}
.logo{
  width:38px;height:38px;flex:0 0 38px;border-radius:12px;
  background:var(--grad);display:grid;place-items:center;color:#fff;
  box-shadow:0 6px 18px rgba(247,119,214,.4);
}
.logo svg{width:20px;height:20px}
.brand{min-width:0;flex:1}
.brand h1{
  font-family:var(--mono);font-size:.7rem;letter-spacing:.1em;font-weight:500;color:var(--on-dark);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.brand p{
  font-size:.72rem;color:var(--on-dark-soft);line-height:1.25;margin-top:2px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.lang{display:flex;flex:0 0 auto;padding:3px;border-radius:999px;background:var(--glass);border:1px solid var(--glass-line)}
.lang button{
  min-width:34px;height:30px;padding:0 8px;border-radius:999px;
  font-family:var(--mono);font-size:.7rem;font-weight:500;letter-spacing:.04em;color:var(--on-dark-soft);
  transition:background .2s,color .2s;
}
.lang button[aria-pressed="true"]{background:#fff;color:var(--ink)}

/* ---------- Corpo scorrevole ---------- */
.scroll{flex:1 1 auto;overflow-y:auto;overscroll-behavior:contain;padding:14px 16px 8px}

/* Introduzione: nessuna scheda, il titolo poggia direttamente sullo sfondo a onde */
.hero{position:relative;padding:14px 4px 6px;animation:rise .6s ease both}
.hero h2{
  font-family:"Inter","Helvetica Neue",Arial,sans-serif;font-weight:800;
  font-size:clamp(1.55rem,7.4vw,2.05rem);line-height:1.08;letter-spacing:-.035em;color:#fff;
  text-shadow:0 2px 18px rgba(15,10,50,.35);
}
.hero h2 .grad{
  background:linear-gradient(90deg,#ff8fe0 0%,#b8a6ff 50%,#4fe3f5 100%);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent;text-shadow:none;
}
.hero p{margin-top:12px;font-size:.95rem;line-height:1.55;color:var(--on-dark-soft);max-width:38ch}

/* Chat */
.chat{margin-top:18px;display:flex;flex-direction:column;gap:12px}
.msg{display:flex;gap:10px;align-items:flex-start;animation:rise .5s .1s ease both}
.avatar{
  width:30px;height:30px;flex:0 0 30px;border-radius:50%;
  background:var(--grad);color:#fff;display:grid;place-items:center;
  box-shadow:0 0 0 2px rgba(255,255,255,.35);
}
.avatar svg{width:16px;height:16px}
.bubble{
  background:var(--surface);color:var(--ink);
  border-radius:4px 18px 18px 18px;padding:12px 14px;
  font-size:.93rem;line-height:1.5;
  box-shadow:var(--shadow-sm);max-width:100%;
}

/* Domande predefinite: pillole chiare con puntino colorato */
.chips{display:flex;flex-wrap:wrap;gap:8px;padding-left:40px;animation:rise .5s .2s ease both}
.chip{
  display:inline-flex;align-items:center;gap:8px;
  padding:9px 14px;border-radius:999px;
  background:var(--surface);border:1px solid transparent;
  color:var(--ink);font-size:.82rem;font-weight:500;line-height:1.2;text-align:left;
  box-shadow:var(--shadow-sm);
  transition:box-shadow .2s,transform .15s,background .2s;
}
.chip::before{content:"";width:7px;height:7px;flex:0 0 7px;border-radius:50%;background:var(--violet)}
.chip:nth-child(3n+1)::before{background:var(--pink)}
.chip:nth-child(3n)::before{background:var(--teal)}
.chip:hover{background:#fff;box-shadow:0 0 0 2px rgba(247,119,214,.6),var(--shadow-sm)}
.chip:active{transform:scale(.97)}

/* Conversazione */
.thread{display:flex;flex-direction:column;gap:12px}
.thread:empty{display:none}
.bubble{min-width:0;overflow-wrap:anywhere}
.msg.me{justify-content:flex-end;animation:rise .3s ease both}
.bubble.me{
  background:var(--grad);color:#fff;border-radius:18px 18px 4px 18px;
  max-width:86%;white-space:pre-wrap;box-shadow:0 6px 18px rgba(10,5,40,.25);
}
.bubble a{color:#5b3fd0;text-decoration:underline}
.bubble code{background:#efecfb;padding:1px 5px;border-radius:6px;font-family:var(--mono);font-size:.85em}
.bubble pre{background:#efecfb;padding:10px;border-radius:10px;overflow-x:auto;margin:6px 0}
.bubble img{max-width:100%;height:auto;border-radius:12px;margin-top:6px}
.bubble.error{background:#fff3f3;color:#7a1c22}
.typing{display:inline-flex;gap:4px;align-items:center;height:1.3em}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--violet);animation:blink 1.2s infinite ease-in-out}
.typing i:nth-child(2){animation-delay:.15s}
.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,80%,100%{opacity:.25;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}
.lead{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.lead input[type=email]{font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;width:100%}
.lead label{display:flex;gap:8px;align-items:flex-start;font-size:.78rem;color:var(--text-soft)}
.lead button{align-self:flex-start;padding:9px 16px;border-radius:12px;background:var(--ink-2);color:#fff;font-weight:600;font-size:.85rem}
.lead .err{color:var(--err);font-size:.78rem}

/* ---------- Stato / errori ---------- */
.status{
  flex:0 0 auto;display:flex;align-items:flex-start;gap:8px;
  margin:0 16px 8px;padding:9px 12px;border-radius:14px;
  font-family:var(--mono);font-size:.7rem;line-height:1.45;
  background:var(--surface);border:1px solid var(--line);color:var(--text-soft);
}
.status .dot{width:8px;height:8px;border-radius:50%;background:var(--text-soft);margin-top:.35em;flex:0 0 8px}
.status[data-state="ready"]{display:none}
.status[data-state="loading"] .dot{background:var(--violet);animation:pulse 1.2s infinite}
.status[data-state="error"],.status[data-state="unconfigured"]{border-color:rgba(192,38,47,.4);background:#fff3f3;color:#7a1c22}
.status[data-state="error"] .dot,.status[data-state="unconfigured"] .dot{background:var(--err)}
.status.note{border-color:rgba(154,91,18,.4);background:#fffaf0;color:#6a3f0b}
.status.note .dot{background:var(--warn)}

/* ---------- Composer ---------- */
.composer{
  flex:0 0 auto;background:rgba(25,20,70,.42);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--glass-line);
  padding:10px 12px calc(8px + env(safe-area-inset-bottom));
}
.field{
  display:flex;align-items:flex-end;gap:6px;
  background:var(--surface);border:1px solid transparent;border-radius:26px;
  padding:5px 5px 5px 16px;transition:box-shadow .2s;
}
.field:focus-within{box-shadow:0 0 0 3px rgba(247,119,214,.55)}
.field.listening{box-shadow:0 0 0 3px rgba(255,90,100,.65)}
textarea{
  flex:1;min-width:0;resize:none;border:0;background:transparent;outline:none;
  font:inherit;font-size:16px; /* 16px evita lo zoom automatico su iOS */
  line-height:1.4;color:var(--ink);padding:9px 0;max-height:120px;
}
textarea::placeholder{color:#8d8fa0}
.icon-btn{
  width:40px;height:40px;flex:0 0 40px;border-radius:50%;
  display:grid;place-items:center;transition:background .2s,transform .15s,opacity .2s;
}
.icon-btn svg{width:20px;height:20px}
.mic{color:var(--ink)}
.mic:hover{background:rgba(127,110,230,.12)}
.mic[aria-pressed="true"]{background:var(--err);color:#fff;animation:pulse 1.2s infinite}
.send{background:var(--grad);color:#fff;box-shadow:0 4px 14px rgba(142,124,240,.5)}
.send:active{transform:scale(.94)}
.send:disabled{opacity:.4;cursor:not-allowed}
.listen-hint{display:none;font-family:var(--mono);font-size:.7rem;color:#ffd1d4;padding:0 6px 6px;font-weight:500}
.listen-hint.show{display:block}
.disclaimer{text-align:center;font-family:var(--mono);font-size:.64rem;color:var(--on-dark-soft);margin-top:7px}

@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* Schermi molto piccoli (320 px) */
@media (max-width:359px){
  .header{gap:8px;padding-left:12px;padding-right:12px}
  .brand p{display:none}
  .lang button{min-width:30px;padding:0 6px}
  .scroll{padding-left:12px;padding-right:12px}
  .hero{padding:10px 2px 4px}
  .chips{padding-left:0}
}
/* Schermi bassi (landscape): comprime l'introduzione */
@media (max-height:520px){.hero p{display:none}.hero{padding:6px 2px}}

/* =====================================================================
   3) STATO E RIFERIMENTI
   ===================================================================== */
const $ = id => document.getElementById(id);
const el = {
  sub:$("t-sub"), heroTitle:$("t-hero-title"), heroText:$("t-hero-text"),

  hint:$("listen-hint"), field:$("form"), scroll:$("scroll")

let lang = "it";
let mxState = "ready";     // ready | unconfigured
let statusOverride = null; // messaggio temporaneo (errori di invio / dettatura)

/* =====================================================================
   4) LINGUA
   ===================================================================== */
function detectLang(){
  try{ const s = localStorage.getItem("awc-lang"); if(s && I18N[s]) return s; }catch(e){}
  const n = (navigator.language || "it").slice(0,2).toLowerCase();
  return I18N[n] ? n : "it";
}

function applyLang(l){
  lang = l;
  const t = I18N[l];
  document.documentElement.lang = t.htmlLang;
  el.sub.textContent = t.sub;
  el.heroTitle.textContent = t.heroTitle + " ";
  const g = document.createElement("span"); g.className = "grad"; g.textContent = t.heroGrad;
  el.heroTitle.appendChild(g);
  el.heroText.textContent = t.heroText;
  el.welcome.textContent = t.welcome;
  el.input.placeholder = t.placeholder;
  el.disclaimer.textContent = t.disclaimer;
  el.send.setAttribute("aria-label", t.send);
  el.input.setAttribute("aria-label", t.placeholder);
  updateMicLabel();
  // Domande predefinite
  el.chips.textContent = "";
  t.chips.forEach(q=>{
    const b = document.createElement("button");
    b.type = "button"; b.className = "chip"; b.textContent = q;
    b.addEventListener("click", ()=> ask(q, {fromChip:true}));
    el.chips.appendChild(b);
  });
  document.querySelectorAll(".lang button").forEach(b=>
    b.setAttribute("aria-pressed", String(b.dataset.lang === l)));
  renderStatus();
  /* NOTA: MxChat non documenta alcun metodo per impostare la lingua del bot.
     La lingua scelta cambia l'interfaccia, il riconoscimento vocale e le domande
     predefinite (che MxChat riceve già nella lingua scelta). */
}

document.querySelectorAll(".lang button").forEach(b=>{
  b.addEventListener("click", ()=>{
    if(b.dataset.lang === lang) return;
    stopDictation();                       // il riconoscimento usa la lingua scelta
    try{ localStorage.setItem("awc-lang", b.dataset.lang); }catch(e){}
    applyLang(b.dataset.lang);
  });
});

/* =====================================================================
   5) STATO COLLEGAMENTO MXCHAT
   ===================================================================== */
function renderStatus(){
  const t = I18N[lang];
  const st = el.status;
  st.classList.remove("note");
  if(statusOverride){
    st.dataset.state = "error";
    st.classList.toggle("note", statusOverride.soft === true);
    el.statusText.textContent = statusOverride.text;
    return;
  }
  st.dataset.state = mxState;
  el.statusText.textContent =
    mxState === "unconfigured"   ? t.stUnconfigured :
    mxState === "error"          ? t.stError : "";
}
function flashStatus(text, soft){
  statusOverride = {text, soft:!!soft};
  renderStatus();
  clearTimeout(flashStatus._t);
  flashStatus._t = setTimeout(()=>{ statusOverride = null; renderStatus(); }, 7000);
}
function setMx(s){ mxState = s; renderStatus(); }

/* =====================================================================
   6) COLLEGAMENTO A MXCHAT (REST di Anywhere)
   ===================================================================== */
const API_PATH = "/wp-json/mxchat-embed/v1";
const SESSION_START = Date.now();
let sessionId = null, busy = false;
const AVATAR_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h10c.5 4.2-.6 7.6-5 8.4C7.6 10.6 6.5 7.2 7 3Z"/><path d="M12 11.4V20M8.5 21h7"/></svg>';

function configured(){ return !!(MXCHAT.wpUrl && MXCHAT.siteKey); }
function apiUrl(path){ return MXCHAT.wpUrl.replace(/\/+$/,"") + API_PATH + path; }
/* Sessione di conversazione: nuova a ogni apertura della pagina (la cronologia non viene ricaricata) */
function newSessionId(){ return "mxchat_chat_" + Date.now() + "_" + Math.random().toString(36).slice(2, 11); }
function getSession(){ return sessionId || (sessionId = newSessionId()); }
function resetSession(){ sessionId = newSessionId(); }

function post(path, body){
  return fetch(apiUrl(path), {
    method:"POST",
    headers:{"Content-Type":"application/json", "X-MxChat-Key":MXCHAT.siteKey},
    body:JSON.stringify(body)
  });
}
function chatPayload(message){
  return {
    message, session_id:getSession(), bot_id:MXCHAT.botId || "default",
    page_url:location.href, page_title:document.title, session_start_timestamp:SESSION_START
  };
}

/* ---------- Testo delle risposte: escape + markdown essenziale ---------- */
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
function safeHref(a){ const u = String(a).trim(); return /^(https?:\/\/|mailto:|tel:)/i.test(u) ? u : null; }
function formatMessage(text){
  if(!text) return "";
  let s = esc(text);
  s = s.replace(/```(\w*)\n?([\s\S]*?)```/g, (m, l, c) => "<pre><code>" + c.trim() + "</code></pre>");
  s = s.replace(/`([^`\n]+)`/g, "<code>$1</code>");
  s = s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/(^|\n)[ \t]*[-*] +/g, "$1• ");
  s = s.replace(/\*(.+?)\*/g, "<em>$1</em>");
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, label, addr) => {
    const href = safeHref(addr);
    return href ? '<a href="' + href + '" target="_blank" rel="noopener noreferrer">' + label + '</a>' : m;
  });
  return s.replace(/\n/g, "<br>");
}
/* Parte HTML delle risposte (schede, immagini…): ripulita da script, moduli, stili e attributi pericolosi */
function sanitizeHtml(html){
  const tpl = document.createElement("template");
  tpl.innerHTML = html;
  const BAD = new Set(["SCRIPT","STYLE","LINK","META","IFRAME","OBJECT","EMBED","FORM","INPUT","SELECT","TEXTAREA","BUTTON","BASE","SVG","MATH"]);
  (function walk(node){
    Array.from(node.children).forEach(ch => {
      if(BAD.has(ch.tagName.toUpperCase())){ ch.remove(); return; }
      Array.from(ch.attributes).forEach(a => {
        const n = a.name.toLowerCase();
        if(n === "href"){ if(!safeHref(a.value)) ch.removeAttribute(a.name); }
        else if(n === "src"){ if(!/^https?:\/\//i.test(a.value.trim())) ch.removeAttribute(a.name); }
        else if(!["alt","title","width","height"].includes(n)) ch.removeAttribute(a.name);
      });
      if(ch.tagName === "A"){ ch.target = "_blank"; ch.rel = "noopener noreferrer"; }
      walk(ch);
    });
  })(tpl.content);
  return tpl.innerHTML;
}

/* ---------- Messaggi nella conversazione ---------- */
function toBottom(){ el.scroll.scrollTop = el.scroll.scrollHeight; }
function addUser(text){
  const row = document.createElement("div"); row.className = "msg me";
  const b = document.createElement("div"); b.className = "bubble me"; b.textContent = text;
  row.appendChild(b); el.thread.appendChild(row); toBottom();
}
function addBot(){
  const row = document.createElement("div"); row.className = "msg";
  const av = document.createElement("div"); av.className = "avatar"; av.setAttribute("aria-hidden","true"); av.innerHTML = AVATAR_SVG;
  const b = document.createElement("div"); b.className = "bubble";
  b.innerHTML = '<span class="typing" role="status"><i></i><i></i><i></i></span>';
  row.append(av, b); el.thread.appendChild(row); toBottom();
  const view = {
    row, bubble:b, html:"",
    set(text, html){
      if(html !== undefined) view.html = html;
      b.innerHTML = formatMessage(text) + (view.html ? (text ? "<br><br>" : "") + sanitizeHtml(view.html) : "");
      toBottom();
    },
    error(msg){ b.classList.add("error"); b.textContent = msg; toBottom(); },
    remove(){ row.remove(); }
  };
  return view;
}

/* ---------- Lettura della risposta in streaming (SSE) ---------- */
async function readStream(res, view){
  const reader = res.body.getReader(), dec = new TextDecoder();
  let buf = "", acc = "", extra = "";
  for(;;){
    const {done, value} = await reader.read();
    if(value) buf += dec.decode(value, {stream:true});
    const lines = buf.split("\n");
    buf = done ? "" : (lines.pop() || "");
    for(const line of lines){
      if(line.indexOf("data: ") !== 0) continue;
      const d = line.slice(6).trim();
      if(d === "[DONE]") return {text:acc, html:extra};
      let j; try{ j = JSON.parse(d); }catch(e){ continue; }
      if(j.content){ acc += j.content; view.set(acc); }
      else if(j.append_html){ extra = j.append_html; }
      else if(j.replace_content){ acc = j.replace_content; view.set(acc); }
      else if(j.error){
        const err = new Error(j.error_message || j.message || j.text || (typeof j.error === "string" ? j.error : "error"));
        err.fromServer = true; throw err;
      }
      else if(j.text || j.message || j.html){ return {data:j}; }
    }
    if(done) return {text:acc, html:extra};
  }
}

/* ---------- Richiesta a MxChat ---------- */
async function askMxChat(text, view, retried){
  let result = null;
  try{
    const res = await post("/stream", chatPayload(text));
    if(!res.ok) throw new Error("HTTP " + res.status);
    const ct = res.headers.get("content-type") || "";
    result = ct.indexOf("application/json") !== -1 ? {data:await res.json()} : await readStream(res, view);
    if(!result.data && !result.text) result = null;           // flusso vuoto → ripiego su /chat
  }catch(e){
    if(e && e.fromServer){ view.error(e.message); return false; }
    result = null;                                             // errore di rete o HTTP → ripiego su /chat
  }
  if(!result){
    const res = await post("/chat", chatPayload(text));        // se fallisce anche questo, errore a chi chiama
    if(!res.ok) throw new Error("HTTP " + res.status);
    result = {data:await res.json()};
  }
  if(result.data) return handleData(result.data, text, view, retried);
  view.set(result.text, result.html);
  return true;
}

function handleData(data, text, view, retried){
  const t = I18N[lang];
  if(data.success === false && data.data && data.data.action === "reset_session"){   // sessione scaduta sul server
    resetSession();
    if(!retried) return askMxChat(text, view, true);
    view.error(t.errEmpty); return false;
  }
  if(data.status === "lead_capture_required"){                // MxChat chiede prima l'email
    view.remove(); showLead(text); return true;
  }
  const reply = data.text || data.message || (data.data && data.data.message) || "";
  const html = data.html || "";
  if(!reply && !html){ view.error(t.errEmpty); return false; }
  view.set(reply, html);
  return true;
}

/* Modulo email (solo se MxChat lo richiede): salva l'email e rinvia la domanda in attesa */
function showLead(pending){
  const t = I18N[lang];
  const view = addBot();
  view.bubble.innerHTML = "";
  const p = document.createElement("div"); p.textContent = t.leadText;
  const form = document.createElement("form"); form.className = "lead";
  const email = document.createElement("input"); email.type = "email"; email.required = true;
  email.placeholder = t.leadPlaceholder; email.autocomplete = "email"; email.setAttribute("aria-label", t.leadPlaceholder);
  const lab = document.createElement("label");
  const cb = document.createElement("input"); cb.type = "checkbox";
  lab.append(cb, document.createTextNode(t.leadConsent));
  const btn = document.createElement("button"); btn.type = "submit"; btn.textContent = t.leadBtn;
  const err = document.createElement("div"); err.className = "err";
  form.append(email, lab, btn, err);
  view.bubble.append(p, form); toBottom();
  form.addEventListener("submit", async e => {
    e.preventDefault(); err.textContent = ""; btn.disabled = true;
    try{
      const res = await post("/email", {email:email.value.trim(), name:"", consent:cb.checked, session_id:getSession()});
      const data = await res.json();
      if(!data.success){ err.textContent = data.message || t.leadErr; btn.disabled = false; return; }
      view.remove();
      ask(pending, {noEcho:true});
    }catch(ex){ err.textContent = t.errConn; btn.disabled = false; }
  });
}

/* =====================================================================
   7) INVIO MESSAGGI → MXCHAT
   Il frontend NON risponde e NON simula risposte: ogni risposta arriva da MxChat.
   ===================================================================== */
async function ask(text, opts){
  text = (text || "").trim();
  opts = opts || {};
  if(!text || busy) return false;
  const t = I18N[lang];
  if(!configured()){ flashStatus(t.stUnconfigured); return false; }
  busy = true; el.send.disabled = true;
  el.chips.style.display = "none";            // le domande predefinite sono solo un punto di partenza
  if(!opts.noEcho) addUser(text);
  if(!opts.fromChip && !opts.noEcho){ el.input.value = ""; autosize(); }
  const view = addBot();
  try{
    await askMxChat(text, view, false);
  }catch(e){
    view.error(t.errConn);                    // rete, CORS o dominio non consentito
    if(!opts.fromChip && !opts.noEcho && !el.input.value){ el.input.value = text; autosize(); }   // il testo non va perso
  }finally{
    busy = false; el.send.disabled = false;
  }
  return true;
}

el.form.addEventListener("submit", e=>{
  e.preventDefault();
  stopDictation();
  ask(el.input.value);
});
el.input.addEventListener("keydown", e=>{
  // Invio = invia; Maiusc+Invio = a capo
  if(e.key === "Enter" && !e.shiftKey && !e.isComposing){
    e.preventDefault(); el.form.requestSubmit();
  }
});

/* Campo di testo che cresce col contenuto (max 120 px) */
function autosize(){
  el.input.style.height = "auto";
  el.input.style.height = Math.min(el.input.scrollHeight, 120) + "px";
}
el.input.addEventListener("input", autosize);

/* =====================================================================
   8) DETTATURA VOCALE (Web Speech API — solo dettatura, nessuna sintesi vocale)
   ===================================================================== */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, listening = false, baseText = "";

function updateMicLabel(){
  const t = I18N[lang];
  el.mic.setAttribute("aria-label", listening ? t.micStop : t.mic);
  el.mic.title = listening ? t.micStop : t.mic;
}

function setListening(on){
  listening = on;
  el.mic.setAttribute("aria-pressed", String(on));
  el.field.classList.toggle("listening", on);
  el.hint.textContent = on ? I18N[lang].listening : "";
  el.hint.classList.toggle("show", on);
  updateMicLabel();
}

function startDictation(){
  if(!SR){ flashStatus(I18N[lang].sp_unsupported, true); return; }
  rec = new SR();
  rec.lang = I18N[lang].speech;     // lingua = lingua selezionata
  rec.interimResults = true;
  rec.continuous = false;            // una frase alla volta, nessun ascolto continuo
  rec.maxAlternatives = 1;
  baseText = el.input.value ? el.input.value.replace(/\s+$/,"") + " " : "";

  rec.onstart = ()=> setListening(true);
  rec.onresult = ev=>{
    let txt = "";
    for(let i = 0; i < ev.results.length; i++) txt += ev.results[i][0].transcript;
    el.input.value = baseText + txt;   // il testo resta modificabile prima dell'invio
    autosize();
  };
  rec.onerror = ev=>{
    const t = I18N[lang];
    const map = {
      "not-allowed":t.sp_denied, "service-not-allowed":t.sp_denied,
      "no-speech":t.sp_nospeech, "audio-capture":t.sp_audio, "network":t.sp_network
    };
    if(ev.error !== "aborted") flashStatus(map[ev.error] || t.sp_generic, true);
  };
  rec.onend = ()=>{ setListening(false); rec = null; el.input.focus(); };

  try{ rec.start(); }
  catch(e){ setListening(false); rec = null; flashStatus(I18N[lang].sp_generic, true); }
}
function stopDictation(){
  if(rec){ try{ rec.stop(); }catch(e){} }
}

if(!SR){
  // Browser non compatibile: il pulsante resta ma spiega il limite; si scrive con la tastiera.
  el.mic.addEventListener("click", ()=> flashStatus(I18N[lang].sp_unsupported, true));
}else{
  el.mic.addEventListener("click", ()=> listening ? stopDictation() : startDictation());
}
// Nessuna registrazione in background: si ferma se la pagina va in secondo piano
document.addEventListener("visibilitychange", ()=>{ if(document.hidden) stopDictation(); });

/* =====================================================================
   9) AVVIO
   ===================================================================== */
applyLang(detectLang());
autosize();
setMx(configured() ? "ready" : "unconfigured");
</script>
