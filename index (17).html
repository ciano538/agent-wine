:root{
  --pink:#f472d0;

  --teal:#2bc0d6;

  --line:#e6e3f1;

  --warn:#9a5b12;
  --err:#c0262f;
  --radius:22px;
  --shadow-sm:0 1px 2px rgba(10,5,40,.12),0 6px 18px rgba(10,5,40,.14);
  --shadow-md:0 18px 44px rgba(10,5,40,.35);

  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}

html,body{height:100%}

button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,textarea:focus-visible{outline:2px solid #fff;outline-offset:2px}

/* Contenitore app: schermo intero, centrato e limitato su schermi larghi */
.app{
  height:100dvh;max-width:560px;margin:0 auto;
  display:flex;flex-direction:column;position:relative;overflow:hidden;
}
@supports not (height:100dvh){.app{height:100vh}}
@media (min-width:600px){
  .app{height:calc(100dvh - 32px);margin-top:16px;border-radius:28px;border:1px solid var(--glass-line);box-shadow:var(--shadow-md)}
}

/* ---------- Header ---------- */
.header{
  display:flex;align-items:center;gap:10px;
  padding:calc(12px + env(safe-area-inset-top)) 16px 10px;
  background:rgba(25,20,70,.38);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--glass-line);flex:0 0 auto;
}
.logo{
  width:38px;height:38px;flex:0 0 38px;border-radius:12px;
  background:var(--grad);display:grid;place-items:center;color:#fff;
  box-shadow:0 6px 18px rgba(247,119,214,.4);
}
.logo svg{width:20px;height:20px}
.brand{min-width:0;flex:1}
.brand h1{
  font-family:var(--mono);font-size:.7rem;letter-spacing:.1em;font-weight:500;color:var(--on-dark);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.brand p{
  font-size:.72rem;color:var(--on-dark-soft);line-height:1.25;margin-top:2px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.lang{display:flex;flex:0 0 auto;padding:3px;border-radius:999px;background:var(--glass);border:1px solid var(--glass-line)}
.lang button{
  min-width:34px;height:30px;padding:0 8px;border-radius:999px;
  font-family:var(--mono);font-size:.7rem;font-weight:500;letter-spacing:.04em;color:var(--on-dark-soft);
  transition:background .2s,color .2s;
}
.lang button[aria-pressed="true"]{background:#fff;color:var(--ink)}

/* ---------- Corpo scorrevole ---------- */
.scroll{flex:1 1 auto;overflow-y:auto;overscroll-behavior:contain;padding:14px 16px 8px;scroll-behavior:smooth}

/* Introduzione: nessuna scheda, il titolo poggia direttamente sullo sfondo a onde */
.hero{position:relative;padding:14px 4px 6px;animation:rise .6s ease both}
.hero h2{
  font-family:"Inter","Helvetica Neue",Arial,sans-serif;font-weight:800;
  font-size:clamp(1.55rem,7.4vw,2.05rem);line-height:1.08;letter-spacing:-.035em;color:#fff;
  text-shadow:0 2px 18px rgba(15,10,50,.35);
}
.hero h2 .grad{
  background:linear-gradient(90deg,#ff8fe0 0%,#b8a6ff 50%,#4fe3f5 100%);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent;text-shadow:none;
}
.hero p{margin-top:12px;font-size:.95rem;line-height:1.55;color:var(--on-dark-soft);max-width:38ch}

/* Chat */
.chat{margin-top:18px;display:flex;flex-direction:column;gap:12px}
.msg{display:flex;gap:10px;align-items:flex-start;animation:rise .5s .1s ease both}
.avatar{
  width:30px;height:30px;flex:0 0 30px;border-radius:50%;
  background:var(--grad);color:#fff;display:grid;place-items:center;
  box-shadow:0 0 0 2px rgba(255,255,255,.35);
}
.avatar svg{width:16px;height:16px}
.bubble{
  background:var(--surface);color:var(--ink);
  border-radius:4px 18px 18px 18px;padding:12px 14px;
  font-size:.93rem;line-height:1.5;
  box-shadow:var(--shadow-sm);max-width:100%;
}

/* Domande predefinite: pillole chiare con puntino colorato */
.chips{display:flex;flex-wrap:wrap;gap:8px;padding-left:40px;animation:rise .5s .2s ease both}
.chip{
  display:inline-flex;align-items:center;gap:8px;
  padding:9px 14px;border-radius:999px;
  background:var(--surface);border:1px solid transparent;
  color:var(--ink);font-size:.82rem;font-weight:500;line-height:1.2;text-align:left;
  box-shadow:var(--shadow-sm);
  transition:box-shadow .2s,transform .15s,background .2s;
}
.chip::before{content:"";width:7px;height:7px;flex:0 0 7px;border-radius:50%;background:var(--violet)}
.chip:nth-child(3n+1)::before{background:var(--pink)}
.chip:nth-child(3n)::before{background:var(--teal)}
.chip:hover{background:#fff;box-shadow:0 0 0 2px rgba(247,119,214,.6),var(--shadow-sm)}
.chip:active{transform:scale(.97)}

/* Conferma di invio (la conversazione vive nel widget ufficiale MxChat) */
.sent{
  display:none;margin-left:40px;border:1px dashed var(--glass-line);border-radius:16px;
  padding:12px 14px;background:var(--glass);
  font-size:.84rem;line-height:1.45;color:var(--on-dark-soft);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
.sent.show{display:block;animation:rise .4s ease both}
.sent q{display:block;margin:4px 0 10px;color:#fff;font-weight:600;quotes:"“" "”"}
.sent button{padding:9px 16px;border-radius:12px;background:#fff;color:var(--ink);font-size:.8rem;font-weight:600}

/* ---------- Stato / errori ---------- */
.status{
  flex:0 0 auto;display:flex;align-items:flex-start;gap:8px;
  margin:0 16px 8px;padding:9px 12px;border-radius:14px;
  font-family:var(--mono);font-size:.7rem;line-height:1.45;
  background:var(--surface);border:1px solid var(--line);color:var(--text-soft);
}
.status .dot{width:8px;height:8px;border-radius:50%;background:var(--text-soft);margin-top:.35em;flex:0 0 8px}
.status[data-state="ready"]{display:none}
.status[data-state="loading"] .dot{background:var(--violet);animation:pulse 1.2s infinite}
.status[data-state="error"],.status[data-state="unconfigured"]{border-color:rgba(192,38,47,.4);background:#fff3f3;color:#7a1c22}
.status[data-state="error"] .dot,.status[data-state="unconfigured"] .dot{background:var(--err)}
.status.note{border-color:rgba(154,91,18,.4);background:#fffaf0;color:#6a3f0b}
.status.note .dot{background:var(--warn)}

/* ---------- Composer ---------- */
.composer{
  flex:0 0 auto;background:rgba(25,20,70,.42);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--glass-line);
  padding:10px 12px calc(8px + env(safe-area-inset-bottom));
}
.field{
  display:flex;align-items:flex-end;gap:6px;
  background:var(--surface);border:1px solid transparent;border-radius:26px;
  padding:5px 5px 5px 16px;transition:box-shadow .2s;
}
.field:focus-within{box-shadow:0 0 0 3px rgba(247,119,214,.55)}
.field.listening{box-shadow:0 0 0 3px rgba(255,90,100,.65)}
textarea{
  flex:1;min-width:0;resize:none;border:0;background:transparent;outline:none;
  font:inherit;font-size:16px; /* 16px evita lo zoom automatico su iOS */
  line-height:1.4;color:var(--ink);padding:9px 0;max-height:120px;
}
textarea::placeholder{color:#8d8fa0}
.icon-btn{
  width:40px;height:40px;flex:0 0 40px;border-radius:50%;
  display:grid;place-items:center;transition:background .2s,transform .15s,opacity .2s;
}
.icon-btn svg{width:20px;height:20px}
.mic{color:var(--ink)}
.mic:hover{background:rgba(127,110,230,.12)}
.mic[aria-pressed="true"]{background:var(--err);color:#fff;animation:pulse 1.2s infinite}
.send{background:var(--grad);color:#fff;box-shadow:0 4px 14px rgba(142,124,240,.5)}
.send:active{transform:scale(.94)}
.send:disabled{opacity:.4;cursor:not-allowed}
.listen-hint{display:none;font-family:var(--mono);font-size:.7rem;color:#ffd1d4;padding:0 6px 6px;font-weight:500}
.listen-hint.show{display:block}
.disclaimer{text-align:center;font-family:var(--mono);font-size:.64rem;color:var(--on-dark-soft);margin-top:7px}

@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* Schermi molto piccoli (320 px) */
@media (max-width:359px){
  .header{gap:8px;padding-left:12px;padding-right:12px}
  .brand p{display:none}
  .lang button{min-width:30px;padding:0 6px}
  .scroll{padding-left:12px;padding-right:12px}
  .hero{padding:10px 2px 4px}
  .chips,.sent{padding-left:0;margin-left:0}
}
/* Schermi bassi (landscape): comprime l'introduzione */
@media (max-height:520px){.hero p{display:none}.hero{padding:6px 2px}}
</style>
</head>

<body>
<div class="app">

  <!-- ============ HEADER ============ -->
  <header class="header">
    <div class="logo" aria-hidden="true">
      <!-- Calice stilizzato -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M7 3h10c.5 4.2-.6 7.6-5 8.4C7.6 10.600 6.500 7.200 7 3Z"/>
        <path d="M12 11.400V20M8.500 21h7"/>
        <path d="M7.300 7h9.400" opacity=".6"/>
      </svg>
    </div>
    <div class="brand">
      <h1>AI WINE CONCIERGE</h1>
      <p id="t-sub"></p>
    </div>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="it" aria-pressed="true">IT</button>
      <button type="button" data-lang="de" aria-pressed="false">DE</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </header>

  <!-- ============ CORPO ============ -->
  <main class="scroll" id="scroll">

    <!-- Introduzione -->
    <section class="hero">
      <h2 id="t-hero-title"></h2>
      <p id="t-hero-text"></p>
    </section>

    <!-- Area chat -->
    <section class="chat" aria-label="Chat">
      <div class="msg">
        <div class="avatar" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h10c.5 4.2-.6 7.6-5 8.4C7.600 10.600 6.500 7.200 7 3Z"/><path d="M12 11.400V20M8.500 21h7"/></svg>
        </div>
        <div class="bubble" id="t-welcome"></div>
      </div>

      <!-- Domande predefinite (generate da JS) -->
      <div class="chips" id="chips"></div>

      <!-- Conferma: il messaggio è stato passato al widget ufficiale MxChat -->
      <div class="sent" id="sent" aria-live="polite">
        <span id="t-sent"></span>
        <q id="sent-text"></q>
        <button type="button" id="open-chat"></button>
      </div>
    </section>
  </main>

  <!-- Stato collegamento / errori (visibile solo se serve) -->
  <div class="status" id="status" role="status" aria-live="polite" data-state="loading">
    <span class="dot"></span><span id="status-text"></span>
  </div>

  <!-- ============ COMPOSIZIONE MESSAGGIO ============ -->
  <footer class="composer">
    <div class="listen-hint" id="listen-hint"></div>
    <form class="field" id="form" autocomplete="off">
      <textarea id="input" rows="1" enterkeyhint="send" autocapitalize="sentences"></textarea>
      <button type="button" class="icon-btn mic" id="mic" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.500 11a6.500 6.500 0 0 0 13 0M12 17.500V21"/></svg>
      </button>
      <button type="submit" class="icon-btn send" id="send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5.500 11.500 12 5l6.500 6.500"/></svg>
      </button>
    </form>
    <p class="disclaimer" id="t-disclaimer"></p>
  </footer>
</div>

<script>
/* =====================================================================
   1) CONFIGURAZIONE MXCHAT ANYWHERE  — DA COMPILARE
   ---------------------------------------------------------------------
   Nel tuo WordPress: MxChat → Embed Widget
     • attiva "Embed Widget Enabled"
     • in "Allowed Domains" aggiungi il dominio Vercel di questa app
       (es. https://nome-progetto.vercel.app) e, per i test, http://localhost:3000
     • copia dallo snippet generato l'indirizzo del sito e la Site Key.

   Formato dello snippet ufficiale (documentazione MxChat Anywhere):
     src="https://TUOSITO/wp-json/mxchat-embed/v1/loader.js?key=SITE_KEY"  (tag script con attributo async)
   Con l'add-on Multi-Bot lo snippet per bot aggiunge "&bot=BOT_ID".

   Se preferisci, puoi anche incollare lo snippet ufficiale così com'è
   nel punto indicato "SNIPPET UFFICIALE" in fondo al <body> e lasciare
   questi valori vuoti: l'app rileverà comunque il widget.
   ===================================================================== */
const MXCHAT = {
  wpUrl:  "",   // es. "https://www.tuosito.it"  (senza slash finale)
  siteKey:"",   // Site Key a 32 caratteri generata da MxChat Anywhere
  botId:  ""    // opzionale: solo con Multi-Bot
};
/* Per far partire le domande predefinite serve anche l'add-on
   "MxChat Triggers" (incluso nella licenza Pro): espone
   window.mxchatOpenAndSend(), window.mxchatOpen(), window.mxchatIsReady(). */

/* =====================================================================
   2) TESTI MULTILINGUA
   ===================================================================== */
const I18N = {
  it:{
    htmlLang:"it", speech:"it-IT",
    sub:"Vini e Cantine del Territorio Gardesano",
    heroTitle:"Il Tuo Viaggio nel Mondo dei Vini dell'Entroterra Gardesano", heroGrad:"Inizia Qui !",
    heroText:"Scopri i vini del Garda, trova la cantina giusta per te e lasciati guidare alla scoperta del territorio.",
    welcome:"Benvenuto! Sono il tuo AI Wine Concierge. Posso aiutarti a scegliere il vino più adatto, scoprire le degustazioni e trovare le cantine del territorio gardesano.",
    chips:["Quale vino mi consigli?","Quali cantine posso visitare?","Dove posso fare una degustazione?","Quale vino abbino al mio piatto?"],
    placeholder:"Scrivi la tua domanda...",
    disclaimer:"Le risposte sono generate da un assistente AI.",
    mic:"Detta con la voce", micStop:"Interrompi la dettatura", send:"Invia",
    listening:"Ti ascolto… parla ora, poi controlla il testo prima di inviare.",
    sent:"Domanda inviata alla chat di MxChat. La risposta compare nella finestra della chat:",
    openChat:"Apri la chat",
    stLoading:"Collegamento a MxChat in corso…",
    stUnconfigured:"Integrazione MxChat non ancora configurata: inserisci l'indirizzo del sito e la Site Key nel file (sezione CONFIGURAZIONE).",
    stError:"Impossibile collegarsi a MxChat. Controlla la connessione e che questo dominio sia nell'elenco «Allowed Domains» di MxChat Anywhere.",
    stNoTriggers:"La chat MxChat è collegata, ma le domande predefinite richiedono l'add-on MxChat Triggers (non rilevato).",
    errNotReady:"MxChat non è ancora pronto: il messaggio non è stato inviato. Riprova tra un istante.",
    errSend:"Invio non riuscito. Il testo è ancora nel campo: riprova.",
    sp_unsupported:"La dettatura vocale non è disponibile in questo browser: puoi scrivere con la tastiera.",
    sp_denied:"Permesso al microfono negato. Abilitalo nelle impostazioni del browser oppure scrivi con la tastiera.",
    sp_nospeech:"Non ho sentito nulla. Tocca il microfono e riprova.",
    sp_audio:"Nessun microfono disponibile su questo dispositivo.",
    sp_network:"Servizio di riconoscimento vocale non raggiungibile. Riprova o usa la tastiera.",
    sp_generic:"Dettatura interrotta. Puoi continuare con la tastiera."
  },
  de:{
    htmlLang:"de", speech:"de-DE",
    sub:"Weine und Weingüter der Gardesana",
    heroTitle:"Ihre Reise in die Welt der Weine des Gardesana-Hinterlands", heroGrad:"beginnt hier !",
    heroText:"Entdecken Sie die Weine des Gardasees, finden Sie das passende Weingut und lassen Sie sich durch die Region führen.",
    welcome:"Willkommen! Ich bin Ihr AI Wine Concierge. Ich helfe Ihnen, den passenden Wein zu finden, Verkostungen zu entdecken und die Weingüter der Gardesana zu finden.",
    chips:["Welchen Wein empfehlen Sie mir?","Welche Weingüter kann ich besuchen?","Wo kann ich eine Verkostung machen?","Welcher Wein passt zu meinem Gericht?"],
    placeholder:"Stellen Sie Ihre Frage...",
    disclaimer:"Die Antworten werden von einem KI-Assistenten generiert.",
    mic:"Per Sprache diktieren", micStop:"Diktat beenden", send:"Senden",
    listening:"Ich höre zu… sprechen Sie jetzt und prüfen Sie den Text vor dem Senden.",
    sent:"Frage an den MxChat-Chat gesendet. Die Antwort erscheint im Chatfenster:",
    openChat:"Chat öffnen",
    stLoading:"Verbindung zu MxChat wird hergestellt…",
    stUnconfigured:"MxChat-Integration noch nicht konfiguriert: Tragen Sie Website-Adresse und Site Key in der Datei ein (Abschnitt CONFIGURAZIONE).",
    stError:"Verbindung zu MxChat nicht möglich. Prüfen Sie die Verbindung und ob diese Domain in den „Allowed Domains“ von MxChat Anywhere eingetragen ist.",
    stNoTriggers:"Der MxChat-Chat ist verbunden, aber die vorgegebenen Fragen benötigen das Add-on MxChat Triggers (nicht erkannt).",
    errNotReady:"MxChat ist noch nicht bereit: Die Nachricht wurde nicht gesendet. Bitte gleich erneut versuchen.",
    errSend:"Senden fehlgeschlagen. Der Text steht noch im Feld: bitte erneut versuchen.",
    sp_unsupported:"Spracherkennung ist in diesem Browser nicht verfügbar: Sie können die Tastatur verwenden.",
    sp_denied:"Mikrofonzugriff verweigert. Aktivieren Sie ihn in den Browsereinstellungen oder verwenden Sie die Tastatur.",
    sp_nospeech:"Ich habe nichts gehört. Tippen Sie auf das Mikrofon und versuchen Sie es erneut.",
    sp_audio:"Auf diesem Gerät ist kein Mikrofon verfügbar.",
    sp_network:"Spracherkennungsdienst nicht erreichbar. Erneut versuchen oder Tastatur verwenden.",
    sp_generic:"Diktat unterbrochen. Sie können mit der Tastatur fortfahren."
  },
  en:{
    htmlLang:"en", speech:"en-GB",
    sub:"Wines & Wineries of the Lake Garda Area",
    heroTitle:"Your Journey into the World of the Lake Garda Hinterland Wines", heroGrad:"Starts Here !",
    heroText:"Discover the wines of Lake Garda, find the right winery for you and let yourself be guided through the region.",
    welcome:"Welcome! I'm your AI Wine Concierge. I can help you choose the right wine, discover tastings and find wineries around Lake Garda.",
    chips:["Which wine do you recommend?","Which wineries can I visit?","Where can I do a wine tasting?","Which wine pairs with my dish?"],
    placeholder:"Ask your question...",
    disclaimer:"Answers are generated by an AI assistant.",
    mic:"Dictate with your voice", micStop:"Stop dictation", send:"Send",
    listening:"Listening… speak now, then check the text before sending.",
    sent:"Question sent to the MxChat chat. The answer appears in the chat window:",
    openChat:"Open chat",
    stLoading:"Connecting to MxChat…",
    stUnconfigured:"MxChat integration not configured yet: add the site address and Site Key in the file (CONFIGURAZIONE section).",
    stError:"Unable to connect to MxChat. Check your connection and that this domain is listed in MxChat Anywhere's “Allowed Domains”.",
    stNoTriggers:"The MxChat chat is connected, but the preset questions require the MxChat Triggers add-on (not detected).",
    errNotReady:"MxChat is not ready yet: the message was not sent. Please try again in a moment.",
    errSend:"Sending failed. Your text is still in the field: please try again.",
    sp_unsupported:"Voice dictation isn't available in this browser: you can type with the keyboard.",
    sp_denied:"Microphone permission denied. Enable it in your browser settings or type instead.",
    sp_nospeech:"I didn't hear anything. Tap the microphone and try again.",
    sp_audio:"No microphone available on this device.",
    sp_network:"Speech recognition service unreachable. Try again or use the keyboard.",
    sp_generic:"Dictation stopped. You can continue with the keyboard."
  }
};

/* =====================================================================
   3) STATO E RIFERIMENTI
   ===================================================================== */
const $ = id => document.getElementById(id);
const el = {
  sub:$("t-sub"), heroTitle:$("t-hero-title"), heroText:$("t-hero-text"),
  welcome:$("t-welcome"), chips:$("chips"), input:$("input"), form:$("form"),
  mic:$("mic"), send:$("send"), disclaimer:$("t-disclaimer"),
  status:$("status"), statusText:$("status-text"),
  sent:$("sent"), sentLabel:$("t-sent"), sentText:$("sent-text"), openChat:$("open-chat"),
  hint:$("listen-hint"), field:$("form"), scroll:$("scroll")
};
let lang = "it";
let mxState = "loading";   // loading | ready | error | unconfigured
let statusOverride = null; // messaggio temporaneo (errori di invio / dettatura)

/* =====================================================================
   4) LINGUA
   ===================================================================== */
function detectLang(){
  try{ const s = localStorage.getItem("awc-lang"); if(s && I18N[s]) return s; }catch(e){}
  const n = (navigator.language || "it").slice(0,2).toLowerCase();
  return I18N[n] ? n : "it";
}

function applyLang(l){
  lang = l;
  const t = I18N[l];
  document.documentElement.lang = t.htmlLang;
  el.sub.textContent = t.sub;
  el.heroTitle.textContent = t.heroTitle + " ";
  const g = document.createElement("span"); g.className = "grad"; g.textContent = t.heroGrad;
  el.heroTitle.appendChild(g);
  el.heroText.textContent = t.heroText;
  el.welcome.textContent = t.welcome;
  el.input.placeholder = t.placeholder;
  el.disclaimer.textContent = t.disclaimer;
  el.sentLabel.textContent = t.sent;
  el.openChat.textContent = t.openChat;
  el.send.setAttribute("aria-label", t.send);
  el.input.setAttribute("aria-label", t.placeholder);
  updateMicLabel();
  // Domande predefinite
  el.chips.textContent = "";
  t.chips.forEach(q=>{
    const b = document.createElement("button");
    b.type = "button"; b.className = "chip"; b.textContent = q;
    b.addEventListener("click", ()=> sendToMxChat(q, {fromChip:true}));
    el.chips.appendChild(b);
  });
  document.querySelectorAll(".lang button").forEach(b=>
    b.setAttribute("aria-pressed", String(b.dataset.lang === l)));
  renderStatus();
  /* NOTA: MxChat non documenta alcun metodo per impostare la lingua del bot.
     La lingua scelta cambia l'interfaccia, il riconoscimento vocale e le domande
     predefinite (che MxChat riceve già nella lingua scelta). */
}

document.querySelectorAll(".lang button").forEach(b=>{
  b.addEventListener("click", ()=>{
    if(b.dataset.lang === lang) return;
    stopDictation();                       // il riconoscimento usa la lingua scelta
    try{ localStorage.setItem("awc-lang", b.dataset.lang); }catch(e){}
    applyLang(b.dataset.lang);
  });
});

/* =====================================================================
   5) STATO COLLEGAMENTO MXCHAT
   ===================================================================== */
function renderStatus(){
  const t = I18N[lang];
  const st = el.status;
  st.classList.remove("note");
  if(statusOverride){
    st.dataset.state = "error";
    st.classList.toggle("note", statusOverride.soft === true);
    el.statusText.textContent = statusOverride.text;
    return;
  }
  st.dataset.state = mxState;
  el.statusText.textContent =
    mxState === "loading"        ? t.stLoading :
    mxState === "unconfigured"   ? t.stUnconfigured :
    mxState === "error"          ? t.stError : "";
}
function flashStatus(text, soft){
  statusOverride = {text, soft:!!soft};
  renderStatus();
  clearTimeout(flashStatus._t);
  flashStatus._t = setTimeout(()=>{ statusOverride = null; renderStatus(); }, 7000);
}
function setMx(s){ mxState = s; renderStatus(); }

/* =====================================================================
   6) CARICAMENTO DEL WIDGET UFFICIALE (MxChat Anywhere)
   ===================================================================== */
function loadAnywhere(){
  // Caso A: snippet ufficiale già incollato nella pagina (vedi fondo del <body>)
  const hasPasted = !!document.querySelector('script[src*="mxchat-embed/v1/loader.js"]');
  if(hasPasted){ waitForReady(); return; }

  // Caso B: configurazione tramite le costanti MXCHAT
  if(!MXCHAT.wpUrl || !MXCHAT.siteKey){ setMx("unconfigured"); return; }

  const base = MXCHAT.wpUrl.replace(/\/+$/,"");
  let src = base + "/wp-json/mxchat-embed/v1/loader.js?key=" + encodeURIComponent(MXCHAT.siteKey);
  if(MXCHAT.botId) src += "&bot=" + encodeURIComponent(MXCHAT.botId);

  const s = document.createElement("script");
  s.src = src; s.async = true;
  s.onerror = ()=> setMx("error");
  document.body.appendChild(s);
  waitForReady();
}

/* Verifica periodicamente, con la funzione documentata window.mxchatIsReady(),
   che la chat sia caricata (max ~20 secondi). */
function waitForReady(){
  let tries = 0;
  const iv = setInterval(()=>{
    tries++;
    if(isReady()){ clearInterval(iv); setMx("ready"); return; }
    if(tries > 40){
      clearInterval(iv);
      // Se il loader c'è ma mancano le funzioni Triggers, lo diciamo chiaramente
      if(typeof window.mxchat === "function" || window.MxChatWidget){
        statusOverride = {text:I18N[lang].stNoTriggers, soft:true};
        renderStatus();
      } else setMx("error");
    }
  }, 500);
}
function isReady(){
  try{
    return typeof window.mxchatIsReady === "function" &&
           typeof window.mxchatOpenAndSend === "function" &&
           !!window.mxchatIsReady();
  }catch(e){ return false; }
}

/* =====================================================================
   7) INVIO MESSAGGI → MXCHAT
   Il frontend NON risponde e NON simula risposte: passa il testo al
   widget ufficiale con window.mxchatOpenAndSend() (add-on MxChat Triggers),
   che apre la chat e invia il messaggio. La conversazione è di MxChat.
   ===================================================================== */
function sendToMxChat(text, opts){
  text = (text || "").trim();
  if(!text) return false;
  if(!isReady()){
    flashStatus(I18N[lang].errNotReady);   // il testo NON viene cancellato
    return false;
  }
  try{
    window.mxchatOpenAndSend(text);
  }catch(e){
    flashStatus(I18N[lang].errSend);
    return false;
  }
  // Conferma discreta (non è una chat simulata: mostra solo cosa è stato inviato)
  el.sentText.textContent = text;
  el.sent.classList.add("show");
  el.scroll.scrollTo({top:el.scroll.scrollHeight});
  if(!(opts && opts.fromChip)){ el.input.value = ""; autosize(); }
  return true;
}

el.form.addEventListener("submit", e=>{
  e.preventDefault();
  stopDictation();
  sendToMxChat(el.input.value);
});
el.input.addEventListener("keydown", e=>{
  // Invio = invia; Maiusc+Invio = a capo
  if(e.key === "Enter" && !e.shiftKey && !e.isComposing){
    e.preventDefault(); el.form.requestSubmit();
  }
});
el.openChat.addEventListener("click", ()=>{
  try{
    if(typeof window.mxchatOpen === "function") window.mxchatOpen();
    else if(typeof window.mxchat === "function") window.mxchat("open");
  }catch(e){ flashStatus(I18N[lang].errNotReady); }
});

/* Campo di testo che cresce col contenuto (max 120 px) */
function autosize(){
  el.input.style.height = "auto";
  el.input.style.height = Math.min(el.input.scrollHeight, 120) + "px";
}
el.input.addEventListener("input", autosize);

/* =====================================================================
   8) DETTATURA VOCALE (Web Speech API — solo dettatura, nessuna sintesi vocale)
   ===================================================================== */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, listening = false, baseText = "";

function updateMicLabel(){
  const t = I18N[lang];
  el.mic.setAttribute("aria-label", listening ? t.micStop : t.mic);
  el.mic.title = listening ? t.micStop : t.mic;
}

function setListening(on){
  listening = on;
  el.mic.setAttribute("aria-pressed", String(on));
  el.field.classList.toggle("listening", on);
  el.hint.textContent = on ? I18N[lang].listening : "";
  el.hint.classList.toggle("show", on);
  updateMicLabel();
}

function startDictation(){
  if(!SR){ flashStatus(I18N[lang].sp_unsupported, true); return; }
  rec = new SR();
  rec.lang = I18N[lang].speech;     // lingua = lingua selezionata
  rec.interimResults = true;
  rec.continuous = false;            // una frase alla volta, nessun ascolto continuo
  rec.maxAlternatives = 1;
  baseText = el.input.value ? el.input.value.replace(/\s+$/,"") + " " : "";

  rec.onstart = ()=> setListening(true);
  rec.onresult = ev=>{
    let txt = "";
    for(let i = 0; i < ev.results.length; i++) txt += ev.results[i][0].transcript;
    el.input.value = baseText + txt;   // il testo resta modificabile prima dell'invio
    autosize();
  };
  rec.onerror = ev=>{
    const t = I18N[lang];
    const map = {
      "not-allowed":t.sp_denied, "service-not-allowed":t.sp_denied,
      "no-speech":t.sp_nospeech, "audio-capture":t.sp_audio, "network":t.sp_network
    };
    if(ev.error !== "aborted") flashStatus(map[ev.error] || t.sp_generic, true);
  };
  rec.onend = ()=>{ setListening(false); rec = null; el.input.focus(); };

  try{ rec.start(); }
  catch(e){ setListening(false); rec = null; flashStatus(I18N[lang].sp_generic, true); }
}
function stopDictation(){
  if(rec){ try{ rec.stop(); }catch(e){} }
}

if(!SR){
  // Browser non compatibile: il pulsante resta ma spiega il limite; si scrive con la tastiera.
  el.mic.addEventListener("click", ()=> flashStatus(I18N[lang].sp_unsupported, true));
}else{
  el.mic.addEventListener("click", ()=> listening ? stopDictation() : startDictation());
}
// Nessuna registrazione in background: si ferma se la pagina va in secondo piano
document.addEventListener("visibilitychange", ()=>{ if(document.hidden) stopDictation(); });
